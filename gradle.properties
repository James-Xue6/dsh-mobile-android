android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.nonTransitiveRClass=true
# 【关键】Gradle 默认 HTTP 无超时 → 连接卡住会"假装在跑"（最长 27 分钟零输出）
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=4
systemProp.org.gradle.internal.repository.initial.backoff=500
# 【实测报错】AGP 拒绝含非 ASCII 的工程路径（本工程在 F:\AI\程序开发\ 下）；
# 官方给出的开关：android.overridePathCheck=true。若后续仍因路径出问题，需把工程移到纯 ASCII 路径。
android.overridePathCheck=true
