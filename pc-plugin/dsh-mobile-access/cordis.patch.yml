# dsh-mobile-access 组合包 patch：只挂一行——本插件自己。
#
# [2026-10-20 整合] 以前这里还有第二行 `id: mobile-gateway`（第三方包
# dsh-plugin-mobile-gateway），插件列表里会看到两个条目，而且协议层的 6 个 fork 补丁
# 只能靠 install.ps1 去 node_modules 里硬改。现在协议层已经 vendor 到
# vendor/gateway/，由本插件的 apply() 用 ctx.plugin 作为子插件挂载：
#   · 对外只有一个插件；
#   · 不再需要改 node_modules（补丁逻辑随之废弃）。
# 下面 config 的键与网关自己的 schema 完全一致（本包 Config 直接复用它）。
- insert:
    - id: mobile-access
      name: dsh-mobile-access
      config:
        # Secure by default: every mobile WebSocket must authenticate with a
        # paired device credential. Pair/revoke APIs remain local-machine only.
        gatewayEnabled: true
        gatewayMode: persistent
        gatewayWaitTimeoutMs: 300000
        requireAuth: true
        adminLoopbackOnly: true
        pairingTtlMs: 300000
        # DSH WebUI remains loopback-only. This row owns the authenticated,
        # WebSocket-only LAN listener for phones.
        lanEnabled: true
        lanHost: 0.0.0.0
        # 3091：避开 dsh-pocket 曾占用的 3081。
        lanPort: 3091

# 网关的 `search` 查询通道需要全量会话索引，而 dsh-web-app 默认把它关成
# `openAt: never`。这条把部署打开为按需加载：node:sqlite 与内存索引都推迟到
# 第一次搜索时才建立，不影响启动。patch 会整体替换该行 config，故两键都重述。
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search
